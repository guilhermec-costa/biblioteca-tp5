name: biblioteca-tp5

services:
  postgres-biblioteca:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: biblioteca
      POSTGRES_USER: ${BIBLIOTECA_DB_USER:-biblioteca}
      POSTGRES_PASSWORD: ${BIBLIOTECA_DB_PASSWORD:-biblioteca}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BIBLIOTECA_DB_USER:-biblioteca} -d biblioteca"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - biblioteca-db:/var/lib/postgresql/data
    networks: [aplicacao]
    restart: unless-stopped

  postgres-notificacoes:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: notificacoes
      POSTGRES_USER: ${NOTIFICACOES_DB_USER:-notificacoes}
      POSTGRES_PASSWORD: ${NOTIFICACOES_DB_PASSWORD:-notificacoes}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOTIFICACOES_DB_USER:-notificacoes} -d notificacoes"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - notificacoes-db:/var/lib/postgresql/data
    networks: [aplicacao]
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-biblioteca}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-biblioteca}
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [aplicacao]
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./monitoring/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    networks: [observabilidade]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks: [observabilidade]
    restart: unless-stopped

  notificacoes-service:
    build:
      context: ./notificacoes-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres-notificacoes:5432/notificacoes
      DATABASE_USER: ${NOTIFICACOES_DB_USER:-notificacoes}
      DATABASE_PASSWORD: ${NOTIFICACOES_DB_PASSWORD:-notificacoes}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-biblioteca}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-biblioteca}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
    ports:
      - "8381:8081"
    depends_on:
      postgres-notificacoes:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [aplicacao, observabilidade]
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres-biblioteca:5432/biblioteca
      DATABASE_USER: ${BIBLIOTECA_DB_USER:-biblioteca}
      DATABASE_PASSWORD: ${BIBLIOTECA_DB_PASSWORD:-biblioteca}
      NOTIFICACOES_SERVICE_URL: http://notificacoes-service:8081
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-biblioteca}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-biblioteca}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
    ports:
      - "8380:8080"
    depends_on:
      postgres-biblioteca:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      notificacoes-service:
        condition: service_healthy
    networks: [aplicacao, observabilidade]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "4373:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks: [aplicacao]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9091:9090"
    depends_on:
      backend:
        condition: service_healthy
      notificacoes-service:
        condition: service_healthy
    networks: [observabilidade]
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.4.2
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on: [loki]
    networks: [observabilidade]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on: [prometheus, loki, tempo]
    networks: [observabilidade]
    restart: unless-stopped

networks:
  aplicacao:
  observabilidade:

volumes:
  biblioteca-db:
  notificacoes-db:
  rabbitmq-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
