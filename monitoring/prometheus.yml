global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: biblioteca
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]

  - job_name: notificacoes
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notificacoes-service:8081"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
