apiVersion: v1
kind: Service
metadata:
  name: notificacoes-service
  namespace: biblioteca
spec:
  selector:
    app: notificacoes-service
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notificacoes-service
  namespace: biblioteca
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notificacoes-service
  template:
    metadata:
      labels:
        app: notificacoes-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: notificacoes-service
          image: biblioteca-notificacoes:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: biblioteca-config
          env:
            - name: DATABASE_URL
              value: jdbc:postgresql://postgres-notificacoes:5432/notificacoes
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: biblioteca-secrets
                  key: notificacoes-db-user
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: biblioteca-secrets
                  key: notificacoes-db-password
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: biblioteca-secrets
                  key: rabbitmq-user
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: biblioteca-secrets
                  key: rabbitmq-password
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: biblioteca
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
---
