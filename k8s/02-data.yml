apiVersion: v1
kind: Service
metadata:
  name: postgres-biblioteca
  namespace: biblioteca
spec:
  selector:
    app: postgres-biblioteca
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-biblioteca
  namespace: biblioteca
spec:
  serviceName: postgres-biblioteca
  replicas: 1
  selector:
    matchLabels:
      app: postgres-biblioteca
  template:
    metadata:
      labels:
        app: postgres-biblioteca
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: biblioteca
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: biblioteca-secrets
                  key: biblioteca-db-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: biblioteca-secrets
                  key: biblioteca-db-password
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d biblioteca"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
