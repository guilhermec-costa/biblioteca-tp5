name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn --batch-mode verify

  notificacoes-tests:
    name: Notification service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notificacoes-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn --batch-mode verify

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  kubernetes-validation:
    name: Kubernetes validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: latest
      - run: kubectl kustomize k8s > /tmp/manifests.yml
      - run: test "$(grep -c '^kind:' /tmp/manifests.yml)" -ge 1

  integration-test:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: [backend-tests, notificacoes-tests, frontend-build, kubernetes-validation]
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/smoke-test.sh
      - name: Collect container logs on failure
        if: failure()
        run: docker compose logs --no-color > docker-compose.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: docker-compose-logs
          path: docker-compose.log
      - name: Stop environment
        if: always()
        run: docker compose down -v

  publish-images:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [integration-test]
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
          - name: notificacoes
            context: notificacoes-service
          - name: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Normalize registry owner
        id: repository
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ steps.repository.outputs.owner }}/biblioteca-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [publish-images]
    if: github.event_name != 'pull_request' && vars.ENABLE_KUBERNETES_DEPLOY == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: latest
      - name: Configure cluster access
        shell: bash
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG_DATA" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Apply manifests and update images
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          kubectl apply -k k8s
          kubectl -n biblioteca set image deployment/backend backend="ghcr.io/$OWNER/biblioteca-backend:${GITHUB_SHA::7}"
          kubectl -n biblioteca set image deployment/notificacoes-service notificacoes-service="ghcr.io/$OWNER/biblioteca-notificacoes:${GITHUB_SHA::7}"
          kubectl -n biblioteca set image deployment/frontend frontend="ghcr.io/$OWNER/biblioteca-frontend:${GITHUB_SHA::7}"
          kubectl -n biblioteca rollout status deployment/backend --timeout=180s
          kubectl -n biblioteca rollout status deployment/notificacoes-service --timeout=180s
          kubectl -n biblioteca rollout status deployment/frontend --timeout=180s
